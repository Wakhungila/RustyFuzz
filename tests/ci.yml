name: RustyFuzz Security Benchmarks

on: [push, pull_request]

jobs:
  test:
    name: Vulnerability Oracle Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release

      - name: Run Benchmarks
        run: cargo test --test benchmarks --release

      - name: Verify Documentation Examples
        run: cargo test --doc
