[workspace]
members = [".", "crates/rustyfuzz-core", "crates/rustyfuzz-evm", "crates/rustyfuzz-engine", "crates/rustyfuzz-artifacts", "crates/rustyfuzz-operations", "crates/rustyfuzz-testkit", "crates/rustyfuzz-backtest", "crates/rustyfuzz-predicate"]
resolver = "2"

# ─────────────────────────────────────────────────────────────────────────────
# BUILD PROFILES
#
# Fuzzing throughput is the product: a campaign that runs 350 executions/second
# cannot compete with one that runs 30,000. These profiles are therefore part
# of the tool's behaviour, not cosmetic tuning. Numbers that justify them are
# in docs/perf/.
#
# `target-cpu=native` is deliberately NOT set here: a binary built that way is
# not portable, and a fuzzer is routinely shipped to other machines. Set it
# explicitly for local campaigns:
#     RUSTFLAGS="-C target-cpu=native" cargo build --release
# ─────────────────────────────────────────────────────────────────────────────

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
# Debug assertions in a fuzzer turn invariant violations into aborts, which is
# not the failure mode we want during a campaign; keep them off in release.
debug-assertions = false
overflow-checks   = false
# A single symbol table keeps crash triage and backtraces usable without the
# full debuginfo that would bloat the artifact.
strip     = "debuginfo"
panic     = "unwind"

# Profiling build: same optimization as release plus symbols and frame pointers,
# so `perf`/`samply` can attribute time when they are available.
[profile.profiling]
inherits      = "release"
debug         = 1
strip         = "none"
lto           = "thin"
codegen-units = 16

# Tests must stay fast to compile while still exercising optimized EVM code
# paths; `cargo test --release` is the throughput-sensitive option.
[profile.bench]
inherits = "release"


[package]
name = "rusty-fuzz"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "benchmark"
path = "src/bin/benchmark.rs"
required-features = ["evm"]

# ─────────────────────────────────────────────────────────────────────────────
# FEATURES
# Build EVM only (default):   cargo build --release
# SVM/SGX:                    unsupported; feature flags emit controlled errors
# Build with Z3 solver:       cargo build --release --features "evm,z3"
# Build with notifications:   cargo build --release --features "evm,notifier"
# ─────────────────────────────────────────────────────────────────────────────
[features]
default  = ["evm", "mimalloc-allocator"]
evm      = [
    "dep:revm",
    "dep:alloy",
    "dep:alloy-dyn-abi",
    "dep:alloy-primitives",
    "dep:alloy-json-abi",
    "dep:reqwest"
]
svm      = []
z3       = ["dep:z3"]
llm      = ["dep:reqwest"]
live-tests = []
notifier = ["dep:reqwest"]
sgx      = []
# Allocation-heavy workload (journal, per-tx account copies, inspector
# temporaries). Enabled by default; disable with --no-default-features for
# platforms without a mimalloc port, or to compare allocators.
mimalloc-allocator = ["dep:mimalloc"]

# ─────────────────────────────────────────────────────────────────────────────
# FUZZING CORE
# ─────────────────────────────────────────────────────────────────────────────
[dependencies]
rustyfuzz-core = { path = "crates/rustyfuzz-core" }
rustyfuzz-evm = { path = "crates/rustyfuzz-evm" }
rustyfuzz-engine = { path = "crates/rustyfuzz-engine" }
rustyfuzz-artifacts = { path = "crates/rustyfuzz-artifacts" }
rustyfuzz-operations = { path = "crates/rustyfuzz-operations" }
libafl       = { version = "0.15.4", features = ["prelude"] }
libafl_bolts = { version = "0.15.4", features = ["prelude"] }
log          = "0.4.29"
hex          = "0.4.3"

# ─────────────────────────────────────────────────────────────────────────────
# EVM STACK  (feature = "evm")
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.revm]
version          = "43.0.3"
default-features = false
features         = ["std", "serde", "memory_limit", "secp256k1", "portable"]
optional         = true

[dependencies.alloy]
version          = "2.0.4"
default-features = false
features         = [
    "providers",
    "rpc-types-eth",
    "network",
    "consensus",
    "eips",
    "rpc-client",
    "reqwest"
]
optional         = true

[dependencies.alloy-dyn-abi]
version  = "1.5.7"
optional = true

[dependencies.alloy-primitives]
version  = "1.5.7"
optional = true

[dependencies.alloy-json-abi]
version  = "1.5.7"
optional = true

# ─────────────────────────────────────────────────────────────────────────────
# SVM STACK  (unsupported)
# Dependencies remain optional for future reconstruction, but the crate root
# currently emits a controlled compile error when `svm` is enabled.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# ASYNC RUNTIME
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.tokio]
version  = "1.52.3"
features = ["full"]

[dependencies.async-trait]
version = "0.1.89"

# ─────────────────────────────────────────────────────────────────────────────
# CLI
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.clap]
version = "4.6.1"
features = ["derive"]

[dependencies.rpassword]
version = "7.3.1"

[dependencies.zeroize]
version = "1.9.0"

# ─────────────────────────────────────────────────────────────────────────────
# LOGGING
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.tracing]
version = "0.1.44"

[dependencies.tracing-subscriber]
version  = "0.3.23"
features = ["env-filter"]

# ─────────────────────────────────────────────────────────────────────────────
# SERIALIZATION
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.serde]
version  = "1.0.228"
features = ["derive"]

[dependencies.serde_json]
version = "1.0.149"

[dependencies.postcard]
version  = "1.1.3"
features = ["use-std"]

[dependencies.toml]
version = "1.1.2"

# ─────────────────────────────────────────────────────────────────────────────
# CORE UTILITIES
# rand at 0.8 matches LibAFL 0.13.2. Upgrade to 0.9 with LibAFL 0.15.x only.
# ─────────────────────────────────────────────────────────────────────────────


[dependencies.anyhow]
version = "1.0.102"

[dependencies.uuid]
version = "1.26.0"
features = ["v4"]

[dependencies.libc]
version = "0.2"

[dependencies.rand]
version = "0.10.1"

[dependencies.bitvec]
version = "1.0.1"

[dependencies.dashmap]
version = "6.1.0"

[dependencies.parking_lot]
version = "0.12.5"

[dependencies.chrono]
version  = "0.4.44"
features = ["serde"]

[dependencies.url]
version = "2.5.8"

[dependencies.hashlink]
version = "0.11.0"

[dependencies.rayon]
version = "1.12.0"

# ─────────────────────────────────────────────────────────────────────────────
# CRYPTO
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.sha2]
version = "0.11.0"

[dependencies.dotenvy]
version = "0.15.7"

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: Z3 concolic solver
#   Linux:  sudo apt install libz3-dev
#   macOS:  brew install z3
[dependencies.z3]
version  = "0.21.0"
optional = true

# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: HTTP client (notifications + LLM API)
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.reqwest]
version  = "0.13.3"
features = ["json", "blocking"]
optional = true

# ─────────────────────────────────────────────────────────────────────────────
# ALLOCATOR
#   Drop-in replacement for the system allocator; see src/allocator.rs for why
#   the fuzzing workload wants it.
# ─────────────────────────────────────────────────────────────────────────────
[dependencies.mimalloc]
version  = "0.1.52"
optional = true
