name: RustyFuzz CI

permissions:
  contents: read

concurrency:
  group: rustyfuzz-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTYFUZZ_STABLE_TOOLCHAIN: "1.97.1"
  RUSTYFUZZ_SANITIZER_TOOLCHAIN: "nightly-2026-08-01"

jobs:
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Cargo audit
        run: |
          audit_status=0
          cargo audit --json > cargo-audit.json || audit_status=$?
          echo "cargo audit exit status: ${audit_status}"
          test -s cargo-audit.json
          cat cargo-audit.json
          if [ "$audit_status" -eq 0 ]; then
            jq -e '.vulnerabilities.count == 0' cargo-audit.json
          else
            jq -e '
              .vulnerabilities.count == 1 and
              (.vulnerabilities.list | length) == 1 and
              .vulnerabilities.list[0].advisory.id == "RUSTSEC-2025-0055" and
              .vulnerabilities.list[0].package.name == "tracing-subscriber" and
              .vulnerabilities.list[0].package.version == "0.2.25"
            ' cargo-audit.json
              cargo metadata --locked --all-features --format-version 1 |
              jq -e '[.packages[] | select(.name == "tracing-subscriber" and .version == "0.2.25")] | length == 1'

          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cargo-audit-report
          path: cargo-audit.json

  # Unit tests - run on all commits
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check
        run: cargo check --workspace --locked
      - name: Unit tests
        run: cargo test --workspace --lib --locked
      - name: Full tests
        run: cargo test --workspace --locked
      - name: Zen client protocol tests
        run: cargo test --features llm --lib --locked satori::reasoning::zen_client
      - name: Z3 feature check
        run: cargo check --features z3 --locked
      - name: SGX unsupported shim check
        run: cargo check --features sgx --locked
      - name: SVM is explicitly unsupported
        run: |
          set +e
          cargo check --features svm --locked 2>svm.err
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "intentionally unsupported" svm.err

  # Integration tests - run on PRs
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: Integration tests
        run: cargo test --test benchmarks --locked

  # Memory leak detection with sanitizers.
  # Per-crate scopes match the locally proven gates; full-workspace ASan is a
  # known issue (tests/end_to_end_smoke.rs trips an ASan runtime check) and is
  # deliberately not a gate. See docs/reengineering/STAGE_2A_CORE_EXTRACTION.md.
  sanitizers:
    name: Sanitizers (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [root-lib, bins, benchmarks, core, engine, evm, artifacts]
    env:
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-08-01
          components: rust-src
      - name: Root library tests
        if: matrix.scope == 'root-lib'
        run: cargo +nightly-2026-08-01 test -p rusty-fuzz --lib --locked --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: Binary tests
        if: matrix.scope == 'bins'
        run: cargo +nightly-2026-08-01 test -p rusty-fuzz --bins --locked --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: Benchmark integration tests
        if: matrix.scope == 'benchmarks'
        run: cargo +nightly-2026-08-01 test -p rusty-fuzz --test benchmarks --locked --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-core
        if: matrix.scope == 'core'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-core --lib --locked --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-engine
        if: matrix.scope == 'engine'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-engine --lib --locked --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-evm
        if: matrix.scope == 'evm'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-evm --lib --locked --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-artifacts
        if: matrix.scope == 'artifacts'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-artifacts --lib --locked --target x86_64-unknown-linux-gnu -Zbuild-std

  # Detection regression on real EVM fixtures, not time-to-discovery evidence.
  oracle-regression:
    name: Executable Oracle Regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: Build validator
        run: cargo build --release --locked --bin rusty-fuzz
      - name: Validate safe and vulnerable counterparts
        run: |
          test ! -e config.toml
          rm -rf benchmarks/results/oracle-controls benchmarks/tmp/oracle-controls
          trap 'rm -f config.toml' EXIT
          cat > config.toml <<'EOF'
          chain = "evm"
          rpc_url = "http://127.0.0.1:8545"
          timeout_secs = 60
          corpus_dir = "benchmarks/tmp/oracle-controls/corpus"
          report_dir = "benchmarks/results/oracle-controls/reports"
          llm_enabled = false
          EOF
          python3 scripts/validate-oracle-controls.py

      - name: Upload execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oracle-control-evidence
          path: benchmarks/results/oracle-controls/

  # Build verification
  build:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: Build
        run: cargo build --verbose --release --locked

      - name: Release checksums
        run: ./scripts/build-release.sh dist
      - name: Upload release checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.os }}
          path: dist/
      - name: Build with supported optional proof feature
        run: cargo build --verbose --features z3 --locked
