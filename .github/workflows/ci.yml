name: RustyFuzz CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTYFUZZ_STABLE_TOOLCHAIN: "1.97.1"
  RUSTYFUZZ_SANITIZER_TOOLCHAIN: "nightly-2026-08-01"

jobs:
  # Unit tests - run on all commits
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Check
        run: cargo check --workspace
      - name: Unit tests
        run: cargo test --lib
      - name: Full tests
        run: cargo test
      - name: Z3 feature check
        run: cargo check --features z3
      - name: SGX unsupported shim check
        run: cargo check --features sgx
      - name: SVM is explicitly unsupported
        run: |
          set +e
          cargo check --features svm 2>svm.err
          status=$?
          set -e
          test "$status" -ne 0
          grep -q "intentionally unsupported" svm.err

  # Integration tests - run on PRs
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Integration tests
        run: cargo test --test benchmarks

  # Memory leak detection with sanitizers.
  # Per-crate scopes match the locally proven gates; full-workspace ASan is a
  # known issue (tests/end_to_end_smoke.rs trips an ASan runtime check) and is
  # deliberately not a gate. See docs/reengineering/STAGE_2A_CORE_EXTRACTION.md.
  sanitizers:
    name: Sanitizers (${{ matrix.scope }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scope: [root-lib, bins, benchmarks, core, engine, evm, artifacts]
    env:
      RUSTFLAGS: -Zsanitizer=address
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: rust-src
      - name: Root library tests
        if: matrix.scope == 'root-lib'
        run: cargo +nightly-2026-08-01 test -p rusty-fuzz --lib --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: Binary tests
        if: matrix.scope == 'bins'
        run: cargo +nightly-2026-08-01 test -p rusty-fuzz --bins --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: Benchmark integration tests
        if: matrix.scope == 'benchmarks'
        run: cargo +nightly-2026-08-01 test -p rusty-fuzz --test benchmarks --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-core
        if: matrix.scope == 'core'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-core --lib --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-engine
        if: matrix.scope == 'engine'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-engine --lib --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-evm
        if: matrix.scope == 'evm'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-evm --lib --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: rustyfuzz-artifacts
        if: matrix.scope == 'artifacts'
        run: cargo +nightly-2026-08-01 test -p rustyfuzz-artifacts --lib --target x86_64-unknown-linux-gnu -Zbuild-std

  # Benchmark regression detection
  benchmark-regression:
    name: Benchmark Regression Detection
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Run benchmarks
        run: cargo test --test benchmarks --release
      - name: Store benchmark result
        run: |
          cargo test --test benchmarks --release -- --nocapture > benchmark_output.txt
          echo "Benchmark completed"
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_output.txt

  # Build verification
  build:
    name: Build Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Build
        run: cargo build --verbose --release
      - name: Build with supported optional proof feature
        run: cargo build --verbose --features z3
