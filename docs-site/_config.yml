title: RustyFuzz
description: Stateful EVM fuzzing. Reproducible execution. Evidence you can inspect.
theme: just-the-docs
url: ""
baseurl: ""
lang: en
search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
color_scheme: light
