[package]
name = "rustyfuzz-evm"
version = "0.1.0"
edition = "2021"
description = "REVM-backed EVM execution backend for RustyFuzz."

[dependencies]
rustyfuzz-core = { path = "../rustyfuzz-core" }
serde = { version = "1.0.228", features = ["derive"] }
parking_lot = "0.12.5"
bitvec = "1.0.1"

anyhow = "1.0.102"
serde_json = "1.0.149"
hex = "0.4.3"

[dependencies.reqwest]
version  = "0.13.3"
features = ["json", "blocking"]

[dependencies.revm]
version          = "38.0.0"
default-features = false
features         = ["std", "serde", "memory_limit", "secp256k1", "portable"]
