[package]
name = "rustyfuzz-predicate"
version = "0.1.0"
edition = "2021"
description = "Bounded predicate IR for RustyFuzz invariants. Design: docs/design/PREDICATE_IR.md"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
# Keccak-256 for Solidity mapping slot derivation. Already in the workspace lock
# via revm's dependency graph, so this adds no new external crate.
sha3 = "0.11.0"
