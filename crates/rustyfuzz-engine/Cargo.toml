[package]
name = "rustyfuzz-engine"
version = "0.1.0"
edition = "2021"
description = "Fuzzing domain model, scheduling, budgeting, and telemetry for RustyFuzz."

[dependencies]
rustyfuzz-core = { path = "../rustyfuzz-core" }
rustyfuzz-evm = { path = "../rustyfuzz-evm" }
serde = { version = "1.0.228", features = ["derive"] }
parking_lot = "0.12.5"
log = "0.4.29"
hex = "0.4.3"
serde_json = "1.0.149"

[dependencies.libafl]
version  = "0.15.4"
features = ["prelude"]

[dependencies.libafl_bolts]
version  = "0.15.4"
features = ["prelude"]
